[package]
name = "rustfft-numpy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "NumPy 2.5-compatible FFT API backed by RustFFT"
license = "MIT OR Apache-2.0"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.30"
pyo3 = { version = "0.30", features = ["extension-module"] }
rustfft = "6.4"
num-complex = "0.4"
